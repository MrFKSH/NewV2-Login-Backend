<!DOCTYPE html>
<html lang="en" style="background-color: rgba(0,0,0,0.0); width:100%; height: 100%;">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growtopia Player Support - GTPS Dashboard</title>
  <link rel="icon" type="image/png"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    sizes="16x16" />
  <link rel="shortcut icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">
  <link rel="icon"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/images/growtopia.ico"
    type="image/x-icon">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/faq-main.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/shop-custom.css">
  <link media="all" rel="stylesheet"
    href="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/css/ingame-custom.css">
  
  <style>
    /* Reset Viewport Container */
    html, body {
      background-color: transparent !important;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #e4e4e7;
      margin: 0 !important;
      padding: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      overflow: hidden !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    .modal-backdrop {
      background-color: transparent !important;
      background: transparent !important;
      display: none !important;
    }

    /* Reset Growtopia & Bootstrap Offsets */
    .content, 
    .common-box, 
    .container, 
    .row, 
    .col-md-12, 
    .col-sm-12, 
    .modal, 
    .modal-body {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      width: 100% !important;
    }

    .modal {
      position: relative !important;
      top: auto !important;
      left: auto !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      opacity: 1 !important;
      max-height: 100vh !important;
    }

    .modal-dialog {
      width: 92% !important;
      max-width: 390px !important;
      margin: 0 auto !important;
      position: relative !important;
      top: auto !important;
    }

    .hidden {
      display: none !important;
    }

    /* THE CARD - Glassmorphism Transparent Black Theme */
    .modal-content {
      background: rgba(12, 12, 14, 0.78) !important; /* Hitam transparan */
      backdrop-filter: blur(16px) saturate(180%) !important;
      -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
      border: 1px solid rgba(255, 255, 255, 0.14) !important;
      border-radius: 16px !important;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 255, 255, 0.03) !important;
      padding: 16px 20px !important;
      width: 100% !important;
      max-height: 94vh !important;
      overflow-y: auto !important;
      overflow-x: hidden !important;
      box-sizing: border-box !important;
    }

    /* Sleek Dark Scrollbar */
    .modal-content::-webkit-scrollbar {
      width: 4px;
    }
    .modal-content::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 4px;
    }
    .modal-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }
    .modal-content::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    /* Header Title */
    .section-title {
      margin: 0 0 14px 0 !important;
      padding: 0 !important;
      text-align: center !important;
      display: block !important;
    }

    .section-title h2 {
      color: #ffffff !important;
      font-size: 14.5px !important;
      font-weight: 700 !important;
      letter-spacing: 1.2px !important;
      text-transform: uppercase !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 8px !important;
      margin: 0 !important;
      padding: 0 !important;
      line-height: 1.2 !important;
    }
    .section-title h2 svg {
      color: #e4e4e7 !important;
      width: 18px !important;
      height: 18px !important;
      flex-shrink: 0;
    }

    /* Input Field Labels */
    .field-label {
      font-size: 9.5px !important;
      font-weight: 700 !important;
      color: #a1a1aa !important;
      letter-spacing: 0.8px !important;
      text-transform: uppercase !important;
      margin-bottom: 3px !important;
      display: block !important;
    }

    /* Form Groups */
    .form-group {
      margin-bottom: 10px !important;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-left {
      position: absolute;
      left: 12px;
      color: #a1a1aa;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .input-icon-right {
      position: absolute;
      right: 12px;
      color: #a1a1aa;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      opacity: 0.8;
      transition: all 0.2s;
    }
    .input-icon-right:hover {
      opacity: 1;
      color: #ffffff;
    }

    /* Inputs */
    .grow-text, .form-control {
      width: 100% !important;
      background-color: rgba(0, 0, 0, 0.45) !important;
      border: 1px solid rgba(255, 255, 255, 0.12) !important;
      border-radius: 8px !important;
      color: #ffffff !important;
      height: 36px !important;
      padding-left: 36px !important;
      padding-right: 36px !important;
      font-size: 12px !important;
      box-shadow: none !important;
      transition: all 0.2s ease !important;
      box-sizing: border-box !important;
    }
    .grow-text::placeholder, .form-control::placeholder {
      color: #71717a !important;
    }
    .grow-text:focus, .form-control:focus {
      background-color: rgba(0, 0, 0, 0.65) !important;
      border-color: rgba(255, 255, 255, 0.4) !important;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1) !important;
      outline: none !important;
    }

    /* Action Buttons */
    .grow-button, .btn-primary {
      width: 100% !important;
      height: 36px !important;
      border-radius: 8px !important;
      font-weight: 600 !important;
      font-size: 12.5px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      gap: 6px !important;
      border: none !important;
      transition: all 0.2s ease !important;
      cursor: pointer !important;
      text-decoration: none !important;
      box-sizing: border-box !important;
    }

    /* Submit Button (Primary Dark Glow) */
    .submit-btn-primary {
      background: linear-gradient(135deg, rgba(45, 45, 50, 0.95) 0%, rgba(20, 20, 22, 0.95) 100%) !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6) !important;
      margin-top: 4px !important;
    }
    .submit-btn-primary:hover {
      background: linear-gradient(135deg, rgba(65, 65, 72, 0.98) 0%, rgba(30, 30, 35, 0.98) 100%) !important;
      border-color: rgba(255, 255, 255, 0.4) !important;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.8), 0 0 12px rgba(255, 255, 255, 0.08) !important;
      color: #ffffff !important;
    }

    /* Register Toggle Button (Hitam Transparan Sekunder) */
    .toggle-register-btn {
      background: rgba(255, 255, 255, 0.06) !important;
      border: 1px solid rgba(255, 255, 255, 0.16) !important;
      color: #e4e4e7 !important;
      margin-top: 2px !important;
    }
    .toggle-register-btn:hover {
      background: rgba(255, 255, 255, 0.12) !important;
      border-color: rgba(255, 255, 255, 0.3) !important;
      color: #ffffff !important;
    }

    /* Forgot Password & Back Links */
    .forgot-link {
      color: #a1a1aa !important;
      font-size: 11.5px;
      text-decoration: none !important;
      transition: color 0.2s;
      display: inline-block;
    }
    .forgot-link:hover {
      color: #ffffff !important;
      text-decoration: underline !important;
    }

    #toggleLogin {
      color: #a1a1aa !important;
      text-decoration: none !important;
      font-size: 12px;
      font-weight: 500;
      transition: color 0.2s;
    }
    #toggleLogin:hover {
      color: #ffffff !important;
      text-decoration: underline !important;
    }

    .form-separator {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 10px 0;
    }
  </style>
</head>
<body style="background-color: rgba(0,0,0,0.0);">

    <section class="common-box">
      <div class="container">
        <div class="row">
          <div class="col-md-12 col-sm-12">
            <div class="modal fade product-list-popup" id="modalShow" tabindex="-1" role="dialog" aria-hidden="false">
              <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content">

                              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>

                            <line x1="16" x2="22" y1="11" y2="11"/>

                        <label class="field-label" for="register-name">GROWTOPIA NAME</label>
                        <div class="input-wrapper">
                          <span class="input-icon-left">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
                              <circle cx="12" cy="7" r="4"/>
                            </svg>
                          </span>
                          <input id="register-name" class="form-control grow-text" required="required"
                            placeholder="Your Growtopia Name *" name="growId" value="" type="text"

                              <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>

            </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');
      const toggleRegister = document.getElementById('toggleRegister');
      const toggleLogin = document.getElementById('toggleLogin');
      const headerTitle = document.getElementById('headerTitle');
      const loginSubmitButton = document.getElementById('loginSubmitBtn');
      const registerSubmitButton = document.getElementById('registerSubmitBtn');

      const loginNameInput = document.getElementById('login-name');
      const passwordInput = document.getElementById('password');

      const registerNameInput = document.getElementById('register-name');
      const registerEmailInput = document.getElementById('register-email');
      const registerPasswordInput = document.getElementById('register-password');
      const registerConfirmPasswordInput = document.getElementById('register-confirm-password');

      // Toggle Password Visibility Logic
      document.querySelectorAll('.toggle-password').forEach(function (toggle) {
        toggle.addEventListener('click', function () {
          const targetId = this.getAttribute('data-target');
          const inputField = document.getElementById(targetId);
          if (inputField) {
            if (inputField.type === 'password') {
              inputField.type = 'text';
              this.style.color = '#ffffff';
            } else {
              inputField.type = 'password';
              this.style.color = '#a1a1aa';
            }
          }
        });
      });

      // @note Toggle to register form (Logika DASHBOARD KECE)
      toggleRegister.addEventListener('click', function (e) {
        e.preventDefault();
        loginForm.classList.add('hidden');
        registerForm.classList.remove('hidden');
        if (headerTitle) headerTitle.textContent = 'REGISTER YOUR GROW ID';
      });

      // @note Toggle back to login form (Logika DASHBOARD KECE)
      toggleLogin.addEventListener('click', function (e) {
        e.preventDefault();
        registerForm.classList.add('hidden');
        loginForm.classList.remove('hidden');
        if (headerTitle) headerTitle.textContent = 'GTPS DASHBOARD';
      });

      // @note Login form input sanitizer & submit handler
      loginNameInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
      });

      passwordInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9@._!\-#$]/g, '');
      });

      loginForm.addEventListener('submit', function (e) {
        if (loginSubmitButton.disabled) {
          e.preventDefault();
          return false;
        }
        loginSubmitButton.disabled = true;
        loginSubmitButton.innerHTML = 'Logging in...';
      });

      // @note Register form input sanitizer & submit handler
      registerNameInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9]/g, '');
      });

      registerPasswordInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9@._!\-#$]/g, '');
      });

      registerConfirmPasswordInput.addEventListener('input', function () {
        this.value = this.value.replace(/[^A-Za-z0-9@._!\-#$]/g, '');
      });

      registerForm.addEventListener('submit', function (e) {
        if (registerSubmitButton.disabled) {
          e.preventDefault();
          return false;
        }

        if (registerPasswordInput.value !== registerConfirmPasswordInput.value) {
          e.preventDefault();
          alert('Passwords do not match!');
          return false;
        }

        registerSubmitButton.disabled = true;
        registerSubmitButton.innerHTML = 'Registering...';
      });
    });
  </script>

  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/jquery-3.7.1.min.js"></script>
  <script src="https://s3.eu-west-1.amazonaws.com/cdn.growtopiagame.com/website/resources/assets/js/bootstrap3.min.js"></script>
  <script>
    let clicked = false;
    $("a").click(function () {
      if (clicked === false) { clicked = true; return true; }
      $(this).attr("onclick", "return false;");
    });

    $(document).ready(function () {
      document.onkeydown = (e) => {
        if (e.key == 123) e.preventDefault();
        if (e.key == 'F12') e.preventDefault();
        if (e.ctrlKey && e.shiftKey && e.key == 'I') e.preventDefault();
        if (e.ctrlKey && e.key == 'I') e.preventDefault();
        if (e.ctrlKey && e.shiftKey && e.key == 'C') e.preventDefault();
        if (e.ctrlKey && e.shiftKey && e.key == 'J') e.preventDefault();
        if (e.ctrlKey && e.key == 'U') e.preventDefault();
      };

      if ($('#modalButton').length) {
        $('#modalButton').trigger('click');
      }

      $('.close').on('click', function () {
        window.location = "https://login.growtopiagame.com/player/validate/close";
      });

      var observer = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          for (var i = 0; i < mutation.addedNodes.length; i++) {
            if (mutation.addedNodes[i].tagName == 'DIV') {
              var thediv = mutation.addedNodes[i];
              var sw = window.screen.width;
              if (sw < 667) {
                $(thediv).css({
                  'transform': 'scale(0.75)',
                  'transform-origin': '0 0',
                  '-webkit-transform': 'scale(0.75)',
                  '-webkit-transform-origin': '0 0',
                  'overflow': 'auto'
                });
              }
            }
          }
        });
      });
      observer.observe(document.body, { attributes: false, childList: true, characterData: false });
    });
  </script>
</body>
</html>
